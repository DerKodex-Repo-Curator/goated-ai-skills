event_model: 3
scenarios:
  - name: a substantial code change waits for design principles
    covers:
      - {gate: design, case: holds}
      - {gate: design, case: clears, way: proof}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export totals.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: &totals
          kind: file_write
          path: src/export.py
          edits: [{removed: "pass", added: "total_0 = 0\ntotal_1 = 1\ntotal_2 = 2\ntotal_3 = 3\ntotal_4 = 4\ntotal_5 = 5"}]
        expect:
          decision: hold
          holds: [{gate: design, kind: justified-skip}]
      - call: {kind: skill_load, skill: software-design-principles}
      - call: *totals

  - name: a skip line clears the design hold
    covers:
      - {gate: design, case: clears, way: skip-line}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export totals.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: *totals
        expect:
          decision: hold
          holds: [{gate: design, kind: justified-skip}]
      - reply: "goated-skip: software-design-principles: one mechanical list of constants"
      - call: *totals

  - name: a person's skip clears the design hold
    covers:
      - {gate: design, case: clears, way: override}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export totals.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: *totals
        expect:
          decision: hold
          holds: [{gate: design, kind: justified-skip}]
      - prompt: {type: prompt, author: person, text: Skip software-design-principles and add the export totals.}
        expect: {decision: allow, notices: [override_recorded]}
      - reply: "goated-route: continue"
      - call: *totals

  - name: a test file never meets the design hold
    covers:
      - {gate: design, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Add the totals test.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call:
          kind: file_write
          path: tests/test_export.py
          edits: [{removed: "pass", added: "total_0 = 0\ntotal_1 = 1\ntotal_2 = 2\ntotal_3 = 3\ntotal_4 = 4\ntotal_5 = 5"}]

  - name: a shell write of six code lines waits for design principles
    covers:
      - {gate: design, case: holds}
      - {gate: design, case: clears, way: proof}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export totals.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: &shell_totals
          kind: shell_command
          shell: posix
          command: "cat > src/export.py <<'EOF'\ntotal_0 = 0\ntotal_1 = 1\ntotal_2 = 2\ntotal_3 = 3\ntotal_4 = 4\ntotal_5 = 5\nEOF"
        expect:
          decision: hold
          holds: [{gate: design, kind: justified-skip}]
      - call: {kind: skill_load, skill: software-design-principles}
      - call: *shell_totals

  - name: text a shell write does not show, or adds under two spellings, counts in full
    covers:
      - {gate: design, case: holds}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export totals.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: shell_command, shell: posix, command: "CODE=$(python gen.py); echo \"$CODE\" > src/export.py"}
        expect:
          decision: hold
          holds: [{gate: design, kind: justified-skip}]
      - call: {kind: shell_command, shell: powershell, command: "Set-Content src/export.py -Value (Get-Content gen.py -Raw)"}
        expect:
          decision: hold
          holds: [{gate: design, kind: justified-skip}]
      - call:
          kind: shell_command
          shell: posix
          command: "cat > src/export.py <<'EOF'\ntotal_0 = 0\ntotal_1 = 1\ntotal_2 = 2\nEOF\ncat >> ./src/export.py <<'EOF'\ntotal_3 = 3\ntotal_4 = 4\nEOF"
        expect:
          decision: hold
          holds: [{gate: design, kind: justified-skip}]
      - call: {kind: shell_command, shell: powershell, command: "New-Item -ItemType File src/export.py -Value @'\ntotal_0 = 0\ntotal_1 = 1\ntotal_2 = 2\ntotal_3 = 3\ntotal_4 = 4\n'@"}
        expect:
          decision: hold
          holds: [{gate: design, kind: justified-skip}]

  - name: a short text a shell write shows is a small change
    covers:
      - {gate: design, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Set the export total.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: shell_command, shell: posix, command: "echo 'total = 1' | cat > src/export.py"}
      - call: {kind: shell_command, shell: powershell, command: "Set-Content -Path src/export.py 'total = 1'"}
      - call: {kind: shell_command, shell: powershell, command: "'total = 1' | Out-File src/export.py"}

  - name: a shell write is the turn's first substantial change and counts toward the third code file
    covers:
      - {gate: design-reads, case: holds}
    steps:
      - prompt: {type: prompt, author: person, text: Split the export totals.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call: {kind: shell_command, shell: posix, command: "cat > src/a.py <<'EOF'\ntotal_0 = 0\ntotal_1 = 1\ntotal_2 = 2\ntotal_3 = 3\ntotal_4 = 4\ntotal_5 = 5\nEOF"}
      - call: {kind: shell_command, shell: posix, command: "cat > src/b.py <<'EOF'\ntotal_0 = 0\ntotal_1 = 1\ntotal_2 = 2\ntotal_3 = 3\ntotal_4 = 4\ntotal_5 = 5\nEOF"}
      - call:
          kind: file_write
          path: src/c.py
          edits: [{removed: "pass", added: "total_0 = 0\ntotal_1 = 1\ntotal_2 = 2\ntotal_3 = 3\ntotal_4 = 4\ntotal_5 = 5"}]
        expect:
          decision: hold
          holds: [{gate: design-reads, kind: justified-skip}]

  - name: a shell write to a test file, or a copy of configuration, selects no design reference
    covers:
      - {gate: design-reads, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export test and settings.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call: {kind: shell_command, shell: posix, command: "cat > tests/test_export.py <<'EOF'\ndef test_total():\n    assert 1 == 1\n\n\ndef test_limit():\n    assert 2 == 2\nEOF"}
      - call: {kind: shell_command, shell: posix, command: cp defaults/export.json config/export.json}

  - name: a shell copy of code adds no text designed in the command
    covers:
      - {gate: design, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Restore the export module.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: shell_command, shell: posix, command: cp backup/export.py src/export.py}
      - call: {kind: shell_command, shell: posix, command: git apply export.diff}

  - name: a shell write to a configuration file waits for the reference it selects
    covers:
      - {gate: design-reads, case: holds}
      - {gate: design-reads, case: clears, way: proof}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export settings.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call: &shell_settings
          kind: shell_command
          shell: posix
          command: "generate-settings > config/export.json"
        expect:
          decision: hold
          holds: [{gate: design-reads, kind: justified-skip}]
      - call: {kind: file_read, path: "{outside}/skills/software-design-principles/references/decoupling.md", whole: true}
      - call: *shell_settings

  - name: a configuration change waits for the reference it selects
    covers:
      - {gate: design-reads, case: holds}
      - {gate: design-reads, case: clears, way: proof}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export settings.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call: &settings
          kind: file_write
          path: config/export.json
          whole_file: true
          edits: [{removed: null, added: "{\n  \"limit\": 2,\n  \"format\": \"csv\",\n  \"header\": true,\n  \"quote\": \"minimal\"\n}\n"}]
        expect:
          decision: hold
          holds: [{gate: design-reads, kind: justified-skip}]
      - call: {kind: file_read, path: "{outside}/skills/software-design-principles/references/decoupling.md", whole: true}
      - call: *settings

  - name: configuration under a fixtures folder is test data the design reads do not judge
    covers:
      - {gate: design-reads, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export fixtures.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call:
          kind: file_write
          path: stack/fixtures/export.yaml
          edits: [{removed: "limit: 1", added: "limit: 2\nformat: csv\nheader: true\nquote: minimal\nrows: 3"}]
      - call:
          kind: file_write
          path: web/__fixtures__/export.json
          whole_file: true
          edits: [{removed: null, added: "{\n  \"limit\": 2,\n  \"format\": \"csv\",\n  \"header\": true,\n  \"quote\": \"minimal\"\n}\n"}]

  - name: configuration outside a fixtures folder, and code inside one, are still judged
    covers:
      - {gate: design-reads, case: holds}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export settings and fixture builder.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call:
          kind: file_write
          path: config/export.yaml
          edits: [{removed: "limit: 1", added: "limit: 2\nformat: csv\nheader: true\nquote: minimal\nrows: 3"}]
        expect:
          decision: hold
          holds: [{gate: design-reads, kind: justified-skip}]
      - call:
          kind: file_write
          path: fixtures/build.py
          edits: [{removed: "pass", added: "def build_rows():\n    return []"}]
        expect:
          decision: hold
          holds: [{gate: design-reads, kind: justified-skip}]

  - name: a skip line clears the design-reads hold
    covers:
      - {gate: design-reads, case: clears, way: skip-line}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export settings.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call: *settings
        expect:
          decision: hold
          holds: [{gate: design-reads, kind: justified-skip}]
      - reply: "goated-skip: software-design-principles: one setting with no design in it"
      - call: *settings

  - name: a person's skip clears the design-reads hold
    covers:
      - {gate: design-reads, case: clears, way: override}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export settings.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call: *settings
        expect:
          decision: hold
          holds: [{gate: design-reads, kind: justified-skip}]
      - prompt: {type: prompt, author: person, text: Skip software-design-principles and add the export settings.}
        expect: {decision: allow, notices: [override_recorded]}
      - reply: "goated-route: continue"
      - call: *settings

  - name: a skip line that clears a design-reads hold lasts the task for its references on the same kind of file
    covers:
      - {gate: design-reads, case: clears, way: lasting-skip}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export settings.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call: *settings
        expect:
          decision: hold
          holds: [{gate: design-reads, kind: justified-skip}]
      - reply: "goated-skip: software-design-principles: one setting with no design in it"
      - call: *settings
      - prompt: {type: prompt, author: person, text: Add the import settings too.}
      - reply: "goated-route: continue"
      - call: &import_settings
          kind: file_write
          path: config/import.json
          whole_file: true
          edits: [{removed: null, added: "{\n  \"limit\": 3,\n  \"format\": \"csv\",\n  \"header\": true,\n  \"quote\": \"minimal\"\n}\n"}]
        expect: {decision: allow, notices: [skip_carried]}

  - name: a lasting design-reads skip covers neither another reference nor another kind of file
    covers:
      - {gate: design-reads, case: holds}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export settings and a guarded read.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call: *settings
        expect:
          decision: hold
          holds: [{gate: design-reads, kind: justified-skip}]
      - call: &guarded_read
          kind: file_write
          path: src/read.py
          edits: [{removed: "pass", added: "try:\n    load()\nexcept OSError:\n    pass"}]
        expect:
          decision: hold
          holds: [{gate: design-reads, kind: justified-skip}]
      - reply: "goated-skip: software-design-principles: one setting and one guard with no design in them"
      - call: *settings
      - call: *guarded_read
      - prompt: {type: prompt, author: person, text: Split the export totals.}
      - reply: "goated-route: continue"
      - call: {kind: file_write, path: src/a.py, edits: [{removed: "pass", added: "total_0 = 0\ntotal_1 = 1\ntotal_2 = 2\ntotal_3 = 3\ntotal_4 = 4\ntotal_5 = 5"}]}
      - call: {kind: file_write, path: src/b.py, edits: [{removed: "pass", added: "total_0 = 0\ntotal_1 = 1\ntotal_2 = 2\ntotal_3 = 3\ntotal_4 = 4\ntotal_5 = 5"}]}
      - call:
          kind: file_write
          path: src/c.py
          edits: [{removed: "pass", added: "total_0 = 0\ntotal_1 = 1\ntotal_2 = 2\ntotal_3 = 3\ntotal_4 = 4\ntotal_5 = 5"}]
        expect:
          decision: hold
          holds: [{gate: design-reads, kind: justified-skip}]
      - call:
          kind: file_write
          path: src/d.py
          edits: [{removed: "pass", added: "with threading.Lock():\n    pass"}]
        expect:
          decision: hold
          holds: [{gate: design-reads, kind: justified-skip}]
      - call:
          kind: file_write
          path: src/e.py
          edits: [{removed: "pass", added: "try:\n    save()\nexcept OSError:\n    pass"}]
        expect: {decision: allow, notices: [skip_carried]}

  - name: a new task ends a lasting design-reads skip
    covers:
      - {gate: design-reads, case: holds}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export settings.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call: *settings
        expect:
          decision: hold
          holds: [{gate: design-reads, kind: justified-skip}]
      - reply: "goated-skip: software-design-principles: one setting with no design in it"
      - call: *settings
      - prompt: {type: prompt, author: person, text: Now add the import settings.}
      - reply: "goated-route: direct"
      - call: *import_settings
        expect:
          decision: hold
          holds: [{gate: design-reads, kind: justified-skip}]

  - name: a compaction ends a lasting design-reads skip
    covers:
      - {gate: design-reads, case: holds}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export settings.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call: *settings
        expect:
          decision: hold
          holds: [{gate: design-reads, kind: justified-skip}]
      - reply: "goated-skip: software-design-principles: one setting with no design in it"
      - call: *settings
      - compaction: true
      - reply: "goated-route: continue"
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - call: {kind: skill_load, skill: software-design-principles}
      - call: *import_settings
        expect:
          decision: hold
          holds: [{gate: design-reads, kind: justified-skip}]

  - name: a lasting skip covers the reads of the next turn's first code change
    covers:
      - {gate: design-reads, case: clears, way: lasting-skip}
    steps:
      - prompt: {type: prompt, author: person, text: Guard the export read.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call: *guarded_read
        expect:
          decision: hold
          holds: [{gate: design-reads, kind: justified-skip}]
      - reply: "goated-skip: software-design-principles: one guard with no design in it"
      - call: *guarded_read
      - prompt: {type: prompt, author: person, text: Guard the export write too.}
      - reply: "goated-route: continue"
      - call:
          kind: file_write
          path: src/write.py
          edits: [{removed: "pass", added: "try:\n    save()\nexcept OSError:\n    pass\nfinally:\n    close()"}]
        expect: {decision: allow, notices: [skip_carried]}

  - name: a skip line that clears the design reads of a loaded skill lasts the task
    covers:
      - {gate: design, case: clears, way: lasting-skip}
    steps:
      - prompt: {type: prompt, author: person, text: Guard the export write.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call: &guarded_write
          kind: file_write
          path: src/write.py
          edits: [{removed: "pass", added: "try:\n    save()\nexcept OSError:\n    pass\nfinally:\n    close()"}]
        expect:
          decision: hold
          holds: [{gate: design, kind: justified-skip}]
      - reply: "goated-skip: software-design-principles: one guard with no design in it"
      - call: *guarded_write
      - prompt: {type: prompt, author: person, text: Guard it once more.}
      - reply: "goated-route: continue"
      - call: *guarded_write
        expect: {decision: allow, notices: [skip_carried]}

  - name: a lasting skip gives no notice on a call another gate holds
    covers:
      - {gate: security, case: holds}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export settings.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call: *settings
        expect:
          decision: hold
          holds: [{gate: design-reads, kind: justified-skip}]
      - reply: "goated-skip: software-design-principles: one setting with no design in it"
      - call: *settings
      - prompt: {type: prompt, author: person, text: Add the login settings too.}
      - reply: "goated-route: continue"
      - call:
          kind: file_write
          path: config/auth.json
          whole_file: true
          edits: [{removed: null, added: "{\n  \"limit\": 3,\n  \"format\": \"csv\",\n  \"header\": true,\n  \"quote\": \"minimal\"\n}\n"}]
        expect:
          decision: hold
          holds: [{gate: security, kind: justified-skip}]
          notices: []

  - name: a lasting design-reads skip for a configuration file does not cover a test file
    covers:
      - {gate: design-reads, case: holds}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export settings.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call: *settings
        expect:
          decision: hold
          holds: [{gate: design-reads, kind: justified-skip}]
      - reply: "goated-skip: software-design-principles: one setting with no design in it"
      - call: *settings
      - prompt: {type: prompt, author: person, text: Test the export settings.}
      - reply: "goated-route: continue"
      - call:
          kind: file_write
          path: tests/test_settings.py
          whole_file: true
          edits: [{removed: null, added: "def test_limit():\n    assert load()[\"limit\"] == 2\n"}]
        expect:
          decision: hold
          holds: [{gate: design-reads, kind: justified-skip}]

  - name: a skip line that clears the design hold lasts one turn
    covers:
      - {gate: design, case: holds}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export totals.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: *totals
        expect:
          decision: hold
          holds: [{gate: design, kind: justified-skip}]
      - reply: "goated-skip: software-design-principles: one mechanical list of constants"
      - call: *totals
      - prompt: {type: prompt, author: person, text: Add the import totals.}
      - reply: "goated-route: continue"
      - call:
          kind: file_write
          path: src/import.py
          edits: [{removed: "pass", added: "total_0 = 0\ntotal_1 = 1\ntotal_2 = 2\ntotal_3 = 3\ntotal_4 = 4\ntotal_5 = 5"}]
        expect:
          decision: hold
          holds: [{gate: design, kind: justified-skip}]

  - name: a docs change selects no design reference
    covers:
      - {gate: design-reads, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Document the export settings.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call:
          kind: file_write
          path: docs/export.md
          whole_file: true
          edits: [{removed: null, added: "# Export\n\nThe limit is two.\n"}]

  - name: an edit that makes a missing code file waits for the new-file references
    covers:
      - {gate: design-reads, case: holds}
      - {gate: design-reads, case: clears, way: proof}
    steps:
      - prompt: {type: prompt, author: person, text: Add the export limit module.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: software-design-principles}
      - call: &make_module
          kind: file_write
          path: src/export_limit.py
          creates: true
          edits: [{removed: "", added: "LIMIT = 2\n"}]
        expect:
          decision: hold
          holds: [{gate: design-reads, kind: justified-skip}]
      - call: {kind: file_read, path: "{outside}/skills/software-design-principles/references/process.md", whole: true}
      - call: {kind: file_read, path: "{outside}/skills/software-design-principles/references/complexity-and-modules.md", whole: true}
      - call: {kind: file_read, path: "{outside}/skills/software-design-principles/references/readability.md", whole: true}
      - call: *make_module

  - name: an edit that removes nothing but makes no file selects no new-file reference
