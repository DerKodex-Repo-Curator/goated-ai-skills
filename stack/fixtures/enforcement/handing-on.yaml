event_model: 4
scenarios:
  - name: a commit waits for its skill and a read of the change
    covers:
      - {gate: commit, case: holds}
      - {gate: commit, case: clears, way: proof}
    steps:
      - prompt: {type: prompt, author: person, text: Fix the note in the README and commit it.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: &note
          kind: file_write
          path: README.md
          edits: [{removed: "Export notes.", added: "Export notes, fixed."}]
      - call: &commit {kind: shell_command, shell: posix, command: "git commit -am \"Fix the export note\""}
        expect:
          decision: hold
          holds: [{gate: commit, kind: strict}]
      - call: {kind: skill_load, skill: commit-message}
      - call: &diff {kind: shell_command, shell: posix, command: git diff}
        result: {ok: true, output: "-Export notes.\n+Export notes, fixed."}
      - call: *commit

  - name: a person's commit message stands down the commit hold
    covers:
      - {gate: commit, case: clears, way: override}
    steps:
      - prompt: {type: prompt, author: person, text: Fix the note in the README and commit it.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: *note
      - call: *commit
        expect:
          decision: hold
          holds: [{gate: commit, kind: strict}]
      - prompt:
          type: prompt
          author: person
          text: "Commit with the message \"Fix the export note\"."
        expect: {decision: allow, notices: [override_recorded]}
      - reply: "goated-route: continue"
      - call: *commit

  - name: a dry-run commit is not a commit
    covers:
      - {gate: commit, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Show what a commit would take.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: shell_command, shell: posix, command: "git commit --dry-run -am \"Fix the export note\""}

  - name: a pull request waits for its skill and a read of the change
    covers:
      - {gate: pull-request, case: holds}
      - {gate: pull-request, case: clears, way: proof}
    steps:
      - prompt: {type: prompt, author: person, text: Open the pull request.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: &open {kind: shell_command, shell: posix, command: "gh pr create --title \"Change\" --body \"A change.\""}
        expect:
          decision: hold
          holds: [{gate: pull-request, kind: strict}]
      - call: {kind: skill_load, skill: pr-description}
      - call: &branch_diff {kind: shell_command, shell: posix, command: git diff main}
        result: {ok: true, output: "+line 1"}
      - call: *open

  - name: a person's skip stands down the pull-request hold
    covers:
      - {gate: pull-request, case: clears, way: override}
    steps:
      - prompt: {type: prompt, author: person, text: Open the pull request.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: *open
        expect:
          decision: hold
          holds: [{gate: pull-request, kind: strict}]
      - prompt: {type: prompt, author: person, text: Skip pr-description and open the pull request.}
        expect: {decision: allow, notices: [override_recorded]}
      - reply: "goated-route: continue"
      - call: *open

  - name: viewing a pull request is not opening one
    covers:
      - {gate: pull-request, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Show the open pull request.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: shell_command, shell: posix, command: gh pr view 12}

  - name: a large pull request is held for review together with its description
    covers:
      - {gate: pr-review, case: holds}
      - {gate: pr-review, case: clears, way: proof}
    setup: {branch_changed_lines: 450}
    steps:
      - prompt: {type: prompt, author: person, text: Open the pull request.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: *open
        expect:
          decision: hold
          holds:
            - {gate: pull-request, kind: strict}
            - {gate: pr-review, kind: justified-skip}
      - call: {kind: skill_load, skill: pr-description}
      - call: *branch_diff
        result: {ok: true, output: "+line 1"}
      - call: *open
        expect:
          decision: hold
          holds: [{gate: pr-review, kind: justified-skip}]
      - call: {kind: skill_load, skill: standards-and-spec-review}
      - call: *open

  - name: a skip line clears the review of a large pull request
    covers:
      - {gate: pr-review, case: clears, way: skip-line}
    setup: {branch_changed_lines: 450}
    steps:
      - prompt: {type: prompt, author: person, text: Open the pull request.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: pr-description}
      - call: *branch_diff
        result: {ok: true, output: "+line 1"}
      - call: *open
        expect:
          decision: hold
          holds: [{gate: pr-review, kind: justified-skip}]
      - reply: "goated-skip: standards-and-spec-review: the branch was reviewed before this request"
      - call: *open

  - name: a person's skip clears the review of a large pull request
    covers:
      - {gate: pr-review, case: clears, way: override}
    setup: {branch_changed_lines: 450}
    steps:
      - prompt: {type: prompt, author: person, text: Open the pull request.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: pr-description}
      - call: *branch_diff
        result: {ok: true, output: "+line 1"}
      - call: *open
        expect:
          decision: hold
          holds: [{gate: pr-review, kind: justified-skip}]
      - prompt: {type: prompt, author: person, text: Skip standards-and-spec-review and open the pull request.}
        expect: {decision: allow, notices: [override_recorded]}
      - reply: "goated-route: continue"
      - call: *branch_diff
        result: {ok: true, output: "+line 1"}
      - call: *open

  - name: a small pull request needs no review
    covers:
      - {gate: pr-review, case: near-miss}
    setup: {branch_changed_lines: 100}
    steps:
      - prompt: {type: prompt, author: person, text: Open the pull request.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: pr-description}
      - call: *branch_diff
        result: {ok: true, output: "+line 1"}
      - call: *open

  - name: a spawn waits for the brief skill and its template
    covers:
      - {gate: spawn, case: holds}
      - {gate: spawn, case: clears, way: proof}
    steps:
      - prompt: {type: prompt, author: person, text: Have an agent audit the exporter.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: &audit
          kind: spawn
          starts_now: true
          brief: "## Goal\n\nAudit the exporter.\n\n## Scope\n\n- Work in: src/export/\n\n## Done Means\n\n- A list of findings.\n\ngoated-skills: code-security-review\n"
        expect:
          decision: hold
          holds: [{gate: spawn, kind: strict}]
      - call: {kind: skill_load, skill: handoff}
      - call: {kind: file_read, path: "{outside}/skills/handoff/references/spawn-brief.md", whole: true}
      - call: *audit
        result: {ok: true, output: No findings., agent: {id: auditor-1}}

  - name: a person's skip stands down the spawn hold
    covers:
      - {gate: spawn, case: clears, way: override}
    steps:
      - prompt: {type: prompt, author: person, text: Have an agent audit the exporter.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: *audit
        expect:
          decision: hold
          holds: [{gate: spawn, kind: strict}]
      - prompt: {type: prompt, author: person, text: Skip handoff and have an agent audit the exporter.}
        expect: {decision: allow, notices: [override_recorded]}
      - reply: "goated-route: continue"
      - call: *audit
        result: {ok: true, output: No findings., agent: {id: auditor-1}}

  - name: offering work a person may start later carries no brief to check
    covers:
      - {gate: spawn, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Suggest a session for the audit.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: spawn, starts_now: false, brief: ""}

  - name: a pull request call is measured between the branches it names
    covers:
      - {gate: pr-review, case: holds}
    setup: {branch_changed_lines: 450}
    steps:
      - prompt: {type: prompt, author: person, text: Open the pull request.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: pull_request, base: main, head: feature}
        expect:
          decision: hold
          holds:
            - {gate: pull-request, kind: strict}
            - {gate: pr-review, kind: justified-skip}

  - name: a pull request call in another repository is not measured here
    covers:
      - {gate: pr-review, case: near-miss}
    setup: {branch_changed_lines: 450}
    steps:
      - prompt: {type: prompt, author: person, text: Open the pull request upstream.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: pr-description}
      - call: {kind: pull_request, base: main, head: feature, repository: upstream-owner/export-tool}

  - name: a shell pull request naming the checkout's own repository is measured
    covers:
      - {gate: pr-review, case: holds}
    setup: {branch_changed_lines: 450, origin_url: "https://github.com/acme/export-tool.git"}
    steps:
      - prompt: {type: prompt, author: person, text: Open the pull request.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: pr-description}
      - call: {kind: shell_command, shell: posix, command: git diff main}
        result: {ok: true, output: "+line 1"}
      - call: {kind: shell_command, shell: posix, command: "gh pr create -R github.com/acme/export-tool --base main --fill"}
        expect:
          decision: hold
          holds: [{gate: pr-review, kind: justified-skip}]

  - name: a shell pull request aimed at another repository is not measured here
    covers:
      - {gate: pr-review, case: near-miss}
    setup: {branch_changed_lines: 450, origin_url: "https://github.com/acme/export-tool.git"}
    steps:
      - prompt: {type: prompt, author: person, text: Open the pull request upstream.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: pr-description}
      - call: {kind: shell_command, shell: posix, command: git diff main}
        result: {ok: true, output: "+line 1"}
      - call: {kind: shell_command, shell: posix, command: "gh pr create --repo upstream-owner/export-tool --base main --fill"}

  - name: a shell pull request with its repository between the noun and the verb is measured
    covers:
      - {gate: pr-review, case: holds}
    setup: {branch_changed_lines: 450, origin_url: "https://github.com/acme/export-tool.git"}
    steps:
      - prompt: {type: prompt, author: person, text: Open the pull request.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: pr-description}
      - call: {kind: shell_command, shell: posix, command: git diff main}
        result: {ok: true, output: "+line 1"}
      - call: {kind: shell_command, shell: posix, command: "gh pr -R acme/export-tool create --base main --fill"}
        expect:
          decision: hold
          holds: [{gate: pr-review, kind: justified-skip}]

  - name: a shell pull request naming another repository between the noun and the verb is not measured
    covers:
      - {gate: pr-review, case: near-miss}
    setup: {branch_changed_lines: 450, origin_url: "https://github.com/acme/export-tool.git"}
    steps:
      - prompt: {type: prompt, author: person, text: Open the pull request upstream.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: pr-description}
      - call: {kind: shell_command, shell: posix, command: git diff main}
        result: {ok: true, output: "+line 1"}
      - call: {kind: shell_command, shell: posix, command: "gh pr -R upstream-owner/export-tool create --base main --fill"}

  - name: each pull request in a chain is measured with its own repository
    covers:
      - {gate: pr-review, case: holds}
    setup: {branch_changed_lines: 450, origin_url: "https://github.com/acme/export-tool.git"}
    steps:
      - prompt: {type: prompt, author: person, text: Open both pull requests.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: pr-description}
      - call: {kind: shell_command, shell: posix, command: git diff main}
        result: {ok: true, output: "+line 1"}
      - call: {kind: shell_command, shell: posix, command: "gh pr create --repo upstream-owner/export-tool --base main --fill && gh pr create --base main --fill"}
        expect:
          decision: hold
          holds: [{gate: pr-review, kind: justified-skip}]

  - name: a chain whose pull requests are each aimed elsewhere or unmeasured is not held
    covers:
      - {gate: pr-review, case: near-miss}
    setup: {branch_changed_lines: 450, origin_url: "https://github.com/acme/export-tool.git"}
    steps:
      - prompt: {type: prompt, author: person, text: Open both pull requests.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: pr-description}
      - call: {kind: shell_command, shell: posix, command: git diff main}
        result: {ok: true, output: "+line 1"}
      - call: {kind: shell_command, shell: posix, command: "gh pr create --base nowhere --fill && gh pr create --repo upstream-owner/export-tool --base main --fill"}
