event_model: 1
scenarios:
  - name: a code change brings the closeout note, and the turn's end waits for proof and docs
    covers:
      - {gate: closeout, case: holds}
      - {gate: closeout, case: clears, way: proof}
    steps:
      - prompt: {type: prompt, author: person, text: Fix the export limit.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: &limit
          kind: file_write
          path: src/export.py
          edits: [{removed: "limit = 1", added: "limit = 2"}]
        expect_after: {decision: allow, notices: [closeout_note]}
      - turn_end: true
        expect:
          decision: hold
          holds: [{gate: closeout, kind: justified-skip, items: [Proof, Docs]}]
      - call: &passing {kind: shell_command, shell: posix, command: pytest -q}
        result: {ok: true, output: "4 passed in 0.10s"}
      - call: {kind: skill_load, skill: doc-sync}
      - call: &diff {kind: shell_command, shell: posix, command: git diff}
        result: {ok: true, output: "-limit = 1\n+limit = 2"}
      - turn_end: true

  - name: skip lines meet the closeout items
    covers:
      - {gate: closeout, case: clears, way: skip-line}
    steps:
      - prompt: {type: prompt, author: person, text: Fix the export limit.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: *limit
      - turn_end: true
        expect:
          decision: hold
          holds: [{gate: closeout, kind: justified-skip, items: [Proof, Docs]}]
      - reply: "goated-skip: verification-before-completion: the module has no test suite yet"
      - reply: "goated-skip: doc-sync: no document names the limit"
      - turn_end: true

  - name: a person's skips stand down the closeout items
    covers:
      - {gate: closeout, case: clears, way: override}
    steps:
      - prompt: {type: prompt, author: person, text: Fix the export limit.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: *limit
      - turn_end: true
        expect:
          decision: hold
          holds: [{gate: closeout, kind: justified-skip, items: [Proof, Docs]}]
      - prompt:
          type: prompt
          author: person
          text: Skip verification-before-completion, skip doc-sync, and fix it once more.
        expect: {decision: allow, notices: [override_recorded]}
      - reply: "goated-route: continue"
      - call: *limit
      - turn_end: true

  - name: a turn that changed only docs meets no closeout and gets no note
    covers:
      - {gate: closeout, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Fix the export notes.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call:
          kind: file_write
          path: docs/export.md
          edits: [{removed: "Limit one.", added: "Limit two."}]
        expect_after: {decision: allow, notices: []}
      - turn_end: true

  - name: a commit meets the closeout once the commit gate passes it
    covers:
      - {gate: closeout, case: holds}
    steps:
      - prompt: {type: prompt, author: person, text: Fix the export limit and commit it.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: *limit
      - call: {kind: skill_load, skill: commit-message}
      - call: *diff
        result: {ok: true, output: "-limit = 1\n+limit = 2"}
      - call: {kind: shell_command, shell: posix, command: "git commit -am \"Raise the export limit\""}
        expect:
          decision: hold
          holds: [{gate: closeout, kind: justified-skip, items: [Proof, Docs]}]

  - name: a subagent's commit meets the closeout of its own turn
    covers:
      - {gate: closeout, case: holds}
      - {gate: closeout, case: clears, way: proof}
    setup: {agent: subagent}
    steps:
      - prompt: {type: prompt, author: session, text: Fix the export limit and commit it.}
      - call: *limit
      - call: {kind: skill_load, skill: commit-message}
      - call: *diff
        result: {ok: true, output: "-limit = 1\n+limit = 2"}
      - call: &subagent_commit {kind: shell_command, shell: posix, command: "git commit -am \"Raise the export limit\""}
        expect:
          decision: hold
          holds: [{gate: closeout, kind: justified-skip, items: [Proof, Docs]}]
      - call: *passing
        result: {ok: true, output: "4 passed in 0.10s"}
      - call: {kind: skill_load, skill: doc-sync}
      - call: *diff
        result: {ok: true, output: "-limit = 1\n+limit = 2"}
      - call: *subagent_commit

  - name: a subagent's commit of docs alone meets no closeout
    covers:
      - {gate: closeout, case: near-miss}
    setup: {agent: subagent}
    steps:
      - prompt: {type: prompt, author: session, text: Note the export limit and commit it.}
      - call: {kind: file_write, path: docs/export.md, edits: [{removed: "Limit one.", added: "Limit two."}]}
      - call: {kind: skill_load, skill: commit-message}
      - call: *diff
        result: {ok: true, output: "-Limit one.\n+Limit two."}
      - call: {kind: shell_command, shell: posix, command: "git commit -am \"Note the export limit\""}

  - name: a failing last check asks for a handoff
    covers:
      - {gate: closeout, case: holds}
    steps:
      - prompt: {type: prompt, author: person, text: Fix the export limit.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: *limit
      - call: {kind: skill_load, skill: doc-sync}
      - call: *passing
        result: {ok: false, output: "F\n1 failed in 0.10s"}
      - call: *diff
        result: {ok: true, output: "-limit = 1\n+limit = 2"}
      - turn_end: true
        expect:
          decision: hold
          holds: [{gate: closeout, kind: justified-skip, items: [Unfinished]}]

  - name: a full route asks for verification, and design principles for the red flags
    covers:
      - {gate: closeout, case: holds}
    steps:
      - prompt: {type: prompt, author: person, text: Fix the export limit.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: full | requires: software-design-principles"
      - call: {kind: skill_load, skill: software-design-principles}
      - call: *limit
      - call: *passing
        result: {ok: true, output: "4 passed in 0.10s"}
      - call: {kind: skill_load, skill: doc-sync}
      - call: *diff
        result: {ok: true, output: "-limit = 1\n+limit = 2"}
      - turn_end: true
        expect:
          decision: hold
          holds: [{gate: closeout, kind: justified-skip, items: [Design, Verification]}]

  - name: a large branch asks for a review, and a sensitive change for its read
    covers:
      - {gate: closeout, case: holds}
    setup: {branch_changed_lines: 450}
    steps:
      - prompt: {type: prompt, author: person, text: Pin the requests version and fix the export limit.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: code-security-review}
      - call:
          kind: file_write
          path: requirements.txt
          edits: [{removed: "requests", added: "requests==2.32.0"}]
      - call: *limit
      - call: *passing
        result: {ok: true, output: "4 passed in 0.10s"}
      - call: {kind: skill_load, skill: doc-sync}
      - turn_end: true
        expect:
          decision: hold
          holds: [{gate: closeout, kind: justified-skip, items: [Docs, Review, Verification, Security]}]

  - name: installing a package asks for the setup record
    covers:
      - {gate: closeout, case: holds}
    steps:
      - prompt: {type: prompt, author: person, text: Add the requests package.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: shell_command, shell: posix, command: pip install requests}
        result: {ok: true, output: "Successfully installed requests-2.32.0"}
      - turn_end: true
        expect:
          decision: hold
          holds: [{gate: closeout, kind: justified-skip, items: [Setup]}]
