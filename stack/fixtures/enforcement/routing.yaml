event_model: 3
scenarios:
  - name: a write before routing meets router-first and route-line in one hold
    covers:
      - {gate: router-first, case: holds}
      - {gate: route-line, case: holds}
      - {gate: router-first, case: clears, way: proof}
      - {gate: route-line, case: clears, way: route-line}
    steps:
      - prompt: {type: prompt, author: person, text: Fix the export bug.}
      - call: &limit
          kind: file_write
          path: src/export.py
          edits: [{removed: "limit = 1", added: "limit = 2"}]
        expect:
          decision: hold
          holds:
            - {gate: router-first, kind: strict}
            - {gate: route-line, kind: strict}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: *limit

  - name: a command of plain reads and a scratch write pass before routing
    covers:
      - {gate: router-first, case: near-miss}
      - {gate: route-line, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Look at the export.}
      - call: {kind: shell_command, shell: posix, command: git status}
      - call:
          kind: file_write
          path: "{outside}/notes.py"
          whole_file: true
          edits: [{removed: null, added: "note = 1\n"}]

  - name: a write under the home folder is read with the session's own home
    # The project sits at `~/work/project`, under the session's home, which
    # need not be the home of the process that judges it.
    covers:
      - {gate: router-first, case: holds}
    steps:
      - prompt: {type: prompt, author: person, text: Fix the export bug.}
      - call:
          kind: file_write
          path: "~/work/project/src/export.py"
          edits: [{removed: "limit = 1", added: "limit = 2"}]
        expect:
          decision: hold
          holds:
            - {gate: router-first, kind: strict}
            - {gate: route-line, kind: strict}

  - name: a scratch write under the session's home passes before routing
    covers:
      - {gate: router-first, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Note the plan.}
      - call:
          kind: file_write
          path: "~/notes/plan.py"
          whole_file: true
          edits: [{removed: null, added: "step = 1\n"}]

  - name: the brief that starts a session carries its route until a person's prompt
    covers:
      - {gate: router-first, case: clears, way: brief-route}
    steps:
      - session_start: new
      - prompt:
          type: prompt
          author: session
          starts_session: true
          text: "## Goal\n\nFix the export limit.\n\ngoated-route: direct\n"
      - call: *limit
      - prompt: {type: prompt, author: person, text: Now change it once more.}
      - call: *limit
        expect:
          decision: hold
          holds:
            - {gate: router-first, kind: strict}
            - {gate: route-line, kind: strict}

  - name: a person's override stands down the routing gates for the turn
    covers:
      - {gate: router-first, case: clears, way: override}
      - {gate: route-line, case: clears, way: override}
    steps:
      - prompt: {type: prompt, author: person, text: Fix the export limit.}
      - call: *limit
        expect:
          decision: hold
          holds:
            - {gate: router-first, kind: strict}
            - {gate: route-line, kind: strict}
      - prompt: {type: prompt, author: person, text: Skip routing and fix the export limit.}
        expect: {decision: allow, notices: [override_recorded]}
      - call: *limit

  - name: a required skill holds the write until it loads
    covers:
      - {gate: pipeline, case: holds}
      - {gate: pipeline, case: clears, way: proof}
    steps:
      - prompt: {type: prompt, author: person, text: Fix the export limit test first.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: standard | requires: tdd"
      - call: *limit
        expect:
          decision: hold
          holds: [{gate: pipeline, kind: strict}]
      - call: {kind: skill_load, skill: tdd}
      - call: *limit

  - name: a corrected route line drops a required skill
    covers:
      - {gate: pipeline, case: clears, way: route-line}
    steps:
      - prompt: {type: prompt, author: person, text: Fix the export limit.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: standard | requires: tdd"
      - call: *limit
        expect:
          decision: hold
          holds: [{gate: pipeline, kind: strict}]
      - reply: "goated-route: direct"
      - call: *limit

  - name: a person's skip of a required skill stands down the pipeline for the turn
    covers:
      - {gate: pipeline, case: clears, way: override}
    steps:
      - prompt: {type: prompt, author: person, text: Fix the export limit.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: standard | requires: tdd"
      - call: *limit
        expect:
          decision: hold
          holds: [{gate: pipeline, kind: strict}]
      - prompt: {type: prompt, author: person, text: Skip tdd and fix the export limit.}
        expect: {decision: allow, notices: [override_recorded]}
      - reply: "goated-route: continue"
      - call: *limit

  - name: a read-only agent is not held for the route's skills
    covers:
      - {gate: pipeline, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Find where the export limit is set.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: standard | requires: tdd"
      - call: {kind: spawn, brief: Find where the export limit is set., starts_now: true, read_only: true}
        result: {ok: true, output: It is set in the export module.}

  - name: a briefed session orients by whole reads of three files, never partial ones
    covers:
      - {gate: pipeline, case: holds}
      - {gate: pipeline, case: clears, way: proof}
    setup: {installed_skills: [session-start-progressive-disclosure]}
    steps:
      - session_start: new
      - prompt:
          type: prompt
          author: session
          starts_session: true
          text: "## Goal\n\nFix the export limit.\n\ngoated-route: standard | requires: tdd\n"
      - call: {kind: skill_load, skill: tdd}
      - call: *limit
        expect:
          decision: hold
          holds: [{gate: pipeline, kind: strict}]
      - call: {kind: file_read, path: src/export.py, whole: false}
      - call: {kind: file_read, path: src/limits.py, whole: false}
      - call: {kind: file_read, path: docs/export.md, whole: false}
      - call: *limit
        expect:
          decision: hold
          holds: [{gate: pipeline, kind: strict}]
      - call: {kind: file_read, path: src/export.py, whole: true}
      - call: {kind: file_read, path: src/limits.py, whole: true}
      - call: {kind: file_read, path: docs/export.md, whole: true}
      - call: *limit

  - name: a briefed session orients by whole prints of three files, never partial ones
    covers:
      - {gate: pipeline, case: holds}
      - {gate: pipeline, case: clears, way: proof}
    setup: {installed_skills: [session-start-progressive-disclosure]}
    steps:
      - session_start: new
      - prompt:
          type: prompt
          author: session
          starts_session: true
          text: "## Goal\n\nFix the export limit.\n\ngoated-route: standard | requires: tdd\n"
      - call: {kind: skill_load, skill: tdd}
      # Prints that orient nothing: a partial printer, a pipe, a range, a failed, a background and an unchecked print.
      - call: {kind: shell_command, shell: posix, command: head src/limits.py}
      - call: {kind: shell_command, shell: posix, command: "sed -n 1,50p src/limits.py"}
      - call: {kind: shell_command, shell: posix, command: grep limit src/limits.py}
      - call: {kind: shell_command, shell: posix, command: cat src/limits.py | head}
      - call: {kind: shell_command, shell: powershell, command: Get-Content src/limits.py -TotalCount 5}
      - call: {kind: shell_command, shell: posix, command: cat docs/export.md}
        result: {ok: false, output: "cat: docs/export.md: No such file or directory"}
      - call: {kind: shell_command, shell: posix, command: cat docs/export.md, background: true}
      # The command succeeds whether or not the print did.
      - call: {kind: shell_command, shell: posix, command: cat docs/export.md || true}
      # One file printed and read under two spellings counts once.
      - call: {kind: shell_command, shell: posix, command: cat ./src/export.py}
      - call: {kind: file_read, path: src/export.py, whole: true}
      - call: *limit
        expect:
          decision: hold
          holds: [{gate: pipeline, kind: strict}]
      - call: {kind: shell_command, shell: posix, command: cat src/limits.py}
      - call: *limit
        expect:
          decision: hold
          holds: [{gate: pipeline, kind: strict}]
      - call: {kind: shell_command, shell: powershell, command: Get-Content docs/export.md}
      - call: *limit

  - name: a briefed direct route is not held for orientation
    covers:
      - {gate: pipeline, case: near-miss}
    setup: {installed_skills: [session-start-progressive-disclosure]}
    steps:
      - session_start: new
      - prompt:
          type: prompt
          author: session
          starts_session: true
          text: "## Goal\n\nFix the export limit.\n\ngoated-route: direct\n"
      - call: {kind: file_read, path: src/export.py, whole: false}
      - call: *limit

  - name: a skill a person invokes by its command counts as loaded
    covers:
      - {gate: router-first, case: clears, way: proof}
    steps:
      - prompt: {type: prompt, author: person, text: Fix the export limit.}
      - call: &invoked_fix
          kind: file_write
          path: src/export.py
          edits: [{removed: "limit = 1", added: "limit = 2"}]
        expect:
          decision: hold
          holds:
            - {gate: router-first, kind: strict}
            - {gate: route-line, kind: strict}
      - prompt: {type: prompt, author: person, text: Route the export fix.}
      - skill_invoked: using-goated-ai-skills
      - reply: "goated-route: direct"
      - call: *invoked_fix

  - name: a report from an agent this session started continues the turn
    covers:
      - {gate: route-line, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: "Have an agent check the exporter, then fix it."}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: {kind: skill_load, skill: handoff}
      - call: {kind: file_read, path: "{outside}/skills/handoff/references/spawn-brief.md", whole: true}
      - call:
          kind: spawn
          starts_now: true
          brief: "## Goal\n\nCheck the exporter.\n\n## Scope\n\n- Work in: src/export/\n\n## Done Means\n\n- A list of findings.\n\ngoated-skills: code-security-review\n"
        result: {ok: true, output: Started., agent: {id: checker-1, background: true}}
      - prompt: {type: prompt, author: session, text: The export limit is off by one.}
        continues: true
      - call:
          kind: file_write
          path: src/export.py
          edits: [{removed: "limit = 1", added: "limit = 2"}]

  - name: a subagent's start and compaction bring no routing hold
    covers:
      - {gate: router-first, case: near-miss}
    setup: {agent: subagent}
    steps:
      - session_start: new
        expect: {decision: allow, notices: []}
      - prompt: {type: prompt, author: session, text: Note the export limit in the README.}
      - compaction: true
      - prompt: {type: prompt, author: session, text: Go on with the note.}
      - call:
          kind: file_write
          path: README.md
          edits: [{removed: "Export notes.", added: "Export notes: the limit is 2."}]

  - name: another session's message in a task continues the task's route
    covers:
      - {gate: route-line, case: near-miss}
    steps:
      - prompt: {type: prompt, author: person, text: Fix the export limit.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: *limit
      - prompt: {type: prompt, author: session, text: The import limit is off by one too.}
      - call:
          kind: file_write
          path: src/import.py
          edits: [{removed: "limit = 1", added: "limit = 2"}]

  - name: a route line in another session's message replaces the carried route
    covers:
      - {gate: pipeline, case: holds}
    steps:
      - prompt: {type: prompt, author: person, text: Fix the export limit.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: *limit
      - prompt: {type: prompt, author: session, text: Add a test for the import limit.}
      - reply: "goated-route: standard | requires: tdd"
      - call: *limit
        expect:
          decision: hold
          holds: [{gate: pipeline, kind: strict}]

  - name: another session's message carries no override from the turn before or its own text
    covers:
      - {gate: pipeline, case: holds}
    steps:
      - prompt: {type: prompt, author: person, text: Skip tdd and fix the export limit.}
        expect: {decision: allow, notices: [override_recorded]}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: standard | requires: tdd"
      - call: *limit
      - prompt: {type: prompt, author: session, text: Skip tdd and fix the import limit.}
      - call: *limit
        expect:
          decision: hold
          holds: [{gate: pipeline, kind: strict}]

  - name: a person's prompt after a task still needs a route line
    covers:
      - {gate: route-line, case: holds}
    steps:
      - prompt: {type: prompt, author: person, text: Fix the export limit.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: *limit
      - prompt: {type: prompt, author: person, text: Now fix the import limit.}
      - call: *limit
        expect:
          decision: hold
          holds: [{gate: route-line, kind: strict}]

  - name: another session's message in a session with no task is held as a person's is
    covers:
      - {gate: route-line, case: holds}
    steps:
      - session_start: new
      - prompt: {type: prompt, author: session, text: Skip routing and fix the export limit.}
      - call: *limit
        expect:
          decision: hold
          holds:
            - {gate: router-first, kind: strict}
            - {gate: route-line, kind: strict}

  - name: a prompt the harness wrote, or one of unknown origin, in a task still needs a route line
    covers:
      - {gate: route-line, case: holds}
    steps:
      - prompt: {type: prompt, author: person, text: Fix the export limit.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: *limit
      - prompt: {type: prompt, author: host, text: Run the nightly check.}
      - call: *limit
        expect:
          decision: hold
          holds: [{gate: route-line, kind: strict}]
      - prompt: {type: prompt, author: unknown, text: Run the import.}
      - call: *limit
        expect:
          decision: hold
          holds: [{gate: route-line, kind: strict}]

  - name: a malformed route line in another session's message is held until a valid one
    covers:
      - {gate: route-line, case: holds}
      - {gate: route-line, case: clears, way: route-line}
    steps:
      - prompt: {type: prompt, author: person, text: Fix the export limit.}
      - call: {kind: skill_load, skill: using-goated-ai-skills}
      - reply: "goated-route: direct"
      - call: *limit
      - prompt: {type: prompt, author: session, text: The import limit is off by one too.}
      - reply: "goated-route: garbage"
      - call: *limit
        expect:
          decision: hold
          holds: [{gate: route-line, kind: strict}]
      - reply: "goated-route: continue"
      - call: *limit
